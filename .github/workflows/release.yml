name: Publish
on:
  release:
    types: [published]
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v3

      - name: Install
        uses: ./.github/composite-actions/install

      # - name: lint
      #   run: pnpm -r lint

      - name: type-check
        run: pnpm -r type-check

      # - name: prettier
      #   run: pnpm prettier -c .

      - name: build
        run: pnpm --filter @dub/analytics build
        env:
          DUB_FINGERPRINT_PUBLIC_KEY: ${{ vars.DUB_FINGERPRINT_PUBLIC_KEY }}

      - run: pnpm --filter @dub/analytics publish --tag beta --no-git-checks
        if: github.event.release.prerelease == true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - run: pnpm --filter @dub/analytics publish --no-git-checks
        if: github.event.release.prerelease == false
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
