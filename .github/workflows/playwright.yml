name: Playwright Tests

# Tests the script built from this commit, so a PR is checked before Cloudflare Pages deploys it
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: |
          pnpm install
          pnpm install --filter @dub/analytics

      - name: Build workspace dependencies
        run: pnpm --filter @dub/analytics build

      - name: Build the analytics script
        run: pnpm --filter @dub/analytics-script build

      - name: Run the analytics script unit tests
        run: pnpm --filter @dub/analytics-script test

      - name: Serve the analytics script
        working-directory: packages/script/dist
        run: |
          nohup python3 -m http.server 4000 > /dev/null 2>&1 &
          curl --silent --fail --retry 10 --retry-connrefused --retry-delay 1 --output /dev/null http://localhost:4000/analytics/script.js

      - name: Install Playwright
        working-directory: apps/nextjs
        run: pnpm add -D @playwright/test

      - name: Install Playwright Browsers
        working-directory: apps/nextjs
        run: pnpm exec playwright install chromium --with-deps

      - name: Run Playwright tests
        working-directory: apps/nextjs
        run: pnpm exec playwright test --reporter=list
        env:
          DUB_ANALYTICS_SCRIPT_URL: http://localhost:4000/analytics/script.site-visit.outbound-domains.js
